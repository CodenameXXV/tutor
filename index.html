<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://raw.githubusercontent.com/CodenameXXV/tutor/refs/heads/main/icon.png" type="image/png">
  <title>TutorBoard — Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            primary: { 50:'#f5f2ed',100:'#ede9e2',200:'#d9d4cc',300:'#b5afaa',400:'#8a8480',500:'#1a1a1a',600:'#c96555',700:'#4a8a6a',800:'#c95555',900:'#5577aa' },
            accent: { 400:'#c96555',500:'#b85545',600:'#a04535' }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg: #f5f2ed;
      --bg-alt: #ede9e2;
      --text: #1a1a1a;
      --text-secondary: #8a8480;
      --text-muted: #b5afaa;
      --border: #d9d4cc;
      --accent: #c96555;
      --accent-hover: #b85545;
      --accent-light: rgba(201,101,85,0.08);
      --accent-bg: rgba(201,101,85,0.06);
      --green: #4a8a6a;
      --red: #c95555;
      --blue: #5577aa;
      --yellow: #c9a045;
      --radius: 0px;
      --font: 'Inter', -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ====== Layout ====== */
    .app-shell { display: flex; height: 100vh; overflow: hidden; }
    .cal-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border); min-width: 0; }
    .info-panel { width: 420px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--bg-alt); overflow-y: auto; }
    @media (max-width: 1024px) { .info-panel { width: 340px; } }
    @media (max-width: 768px) { .app-shell { flex-direction: column; } .info-panel { width: 100%; max-height: 50vh; } .cal-panel { border-right: none; border-bottom: 1px solid var(--border); } }

    /* ====== Top Bar ====== */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 52px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .top-bar-left { display: flex; align-items: center; gap: 16px; }
    .top-bar-right { display: flex; align-items: center; gap: 8px; }

    /* ====== Nav ====== */
    .nav-list { display: flex; gap: 2px; }
    .nav-item {
      padding: 6px 14px; font-size: 13px; font-weight: 450;
      color: var(--text-secondary); cursor: pointer;
      transition: all 0.15s; border: none; background: none;
      letter-spacing: 0.01em;
      border-bottom: 2px solid transparent;
    }
    .nav-item:hover { color: var(--text); }
    .nav-item.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ====== Calendar Header ====== */
    .cal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px 12px; flex-shrink: 0; }
    .cal-title { font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }
    .cal-nav { display: flex; align-items: center; gap: 4px; }
    .cal-nav-btn {
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); background: var(--bg); cursor: pointer;
      transition: all 0.15s; color: var(--text); font-size: 14px;
    }
    .cal-nav-btn:hover { background: var(--bg-alt); }
    .cal-nav-btn:active { background: var(--border); }
    .cal-today-btn {
      padding: 4px 12px; font-size: 12px; font-weight: 500;
      border: 1px solid var(--border); background: var(--bg); cursor: pointer;
      transition: all 0.15s; color: var(--text-secondary);
    }
    .cal-today-btn:hover { color: var(--text); background: var(--bg-alt); }

    /* ====== View Toggle ====== */
    .view-toggle { display: flex; border: 1px solid var(--border); }
    .view-toggle button {
      padding: 5px 14px; font-size: 11px; font-weight: 500;
      border: none; background: var(--bg); cursor: pointer;
      color: var(--text-secondary); transition: all 0.15s;
      letter-spacing: 0.05em; text-transform: uppercase;
    }
    .view-toggle button:not(:last-child) { border-right: 1px solid var(--border); }
    .view-toggle button:hover { color: var(--text); }
    .view-toggle button.active { background: var(--text); color: var(--bg); }

    /* ====== Calendar Grid ====== */
    .cal-week-grid { display: grid; border-top: 1px solid var(--border); flex: 1; overflow-y: auto; position: relative; }
    .cal-week-header { font-size: 11px; font-weight: 500; color: var(--text-muted); padding: 8px 4px; text-align: center; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.05em; }
    .cal-week-header:first-child { border-right: 1px solid var(--border); }
    .cal-week-header.today-col { color: var(--accent); }
    .cal-time-slot { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 2px 6px; font-size: 10px; color: var(--text-muted); position: relative; }
    .cal-time-slot:hover { background: rgba(0,0,0,0.02); }
    .cal-time-label { position: absolute; right: 6px; font-size: 10px; color: var(--text-muted); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
    .cal-day-slot { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); position: relative; cursor: pointer; transition: background 0.1s; }
    .cal-day-slot:hover { background: var(--accent-bg); }
    .cal-day-slot.today-slot { background: rgba(201,101,85,0.03); }

    /* ====== Lesson Pills ====== */
    .lesson-dot {
      position: absolute; left: 2px; right: 2px; top: 2px;
      padding: 2px 6px; font-size: 10px; font-weight: 500;
      cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      transition: all 0.15s; z-index: 2;
      border-left: 3px solid var(--accent);
      background: var(--accent-light);
      color: var(--accent);
    }
    .lesson-dot:hover { background: rgba(201,101,85,0.15); }
    .lesson-dot.completed { border-left-color: var(--green); background: rgba(74,138,106,0.08); color: var(--green); }
    .lesson-dot.cancelled { border-left-color: var(--red); background: rgba(201,85,85,0.08); color: var(--red); text-decoration: line-through; }
    .lesson-dot.absent { border-left-color: var(--yellow); background: rgba(201,160,69,0.08); color: var(--yellow); }

    /* ====== Month Grid ====== */
    .cal-month-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--border); flex: 1; overflow-y: auto; }
    .month-cell { min-height: 90px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 4px 6px; cursor: pointer; transition: background 0.1s; position: relative; }
    .month-cell:hover { background: var(--accent-bg); }
    .month-cell:nth-child(7n) { border-right: none; }
    .month-cell.other-month { opacity: 0.3; }
    .month-cell.today-cell { background: var(--accent-bg); }
    .month-date { font-size: 13px; font-weight: 450; color: var(--text); margin-bottom: 2px; display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; }
    .month-date.today { background: var(--accent); color: white; font-weight: 600; }

    /* ====== Info Panel ====== */
    .info-header { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .info-date { font-size: 24px; font-weight: 400; letter-spacing: -0.02em; line-height: 1.2; }
    .info-day { font-size: 12px; color: var(--text-secondary); font-weight: 450; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
    .info-content { padding: 12px 20px; flex: 1; overflow-y: auto; }
    .info-section { margin-bottom: 20px; }
    .info-section-title { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .info-lesson { padding: 8px 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; cursor: pointer; transition: background 0.1s; margin: 0 -8px; padding: 8px; }
    .info-lesson:hover { background: var(--accent-bg); }
    .info-lesson-time { font-size: 12px; font-weight: 500; color: var(--text-secondary); min-width: 44px; }
    .info-lesson-name { font-size: 13px; font-weight: 450; flex: 1; }
    .info-lesson-status { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
    .info-stat { display: flex; align-items: baseline; gap: 6px; padding: 6px 0; }
    .info-stat-value { font-size: 20px; font-weight: 400; letter-spacing: -0.01em; }
    .info-stat-label { font-size: 11px; color: var(--text-secondary); }
    .info-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

    /* ====== Modal ====== */
    .modal-overlay { position: fixed; inset: 0; background: rgba(26,26,26,0.3); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { transform: translateY(8px); transition: transform 0.25s ease; max-height: 85vh; overflow-y: auto; background: var(--bg); border: 1px solid var(--border); min-width: 400px; max-width: 560px; }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    .modal-body { padding: 24px; }
    .modal-title { font-size: 16px; font-weight: 500; margin-bottom: 16px; letter-spacing: -0.01em; }

    /* ====== Toast ====== */
    .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column; gap: 6px; }
    .toast {
      padding: 10px 16px; color: var(--bg); font-size: 13px; font-weight: 450;
      animation: toastIn 0.25s ease, toastOut 0.2s ease 2.8s forwards;
      border: 1px solid var(--text); background: var(--text);
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(4px); } }
    .toast-success { background: var(--green); border-color: var(--green); color: white; }
    .toast-error { background: var(--red); border-color: var(--red); color: white; }
    .toast-info { background: var(--accent); border-color: var(--accent); color: white; }

    /* ====== Context Menu ====== */
    .ctx-menu { position: fixed; z-index: 300; min-width: 160px; background: var(--bg); border: 1px solid var(--border); padding: 4px; opacity: 0; transform: scale(0.97) translateY(-4px); transition: all 0.15s ease; pointer-events: none; }
    .ctx-menu.active { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }
    .ctx-menu-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 10px; font-size: 12px; font-weight: 450; border: none; background: none; cursor: pointer; text-align: left; transition: background 0.1s; }
    .ctx-menu-item:hover { background: var(--accent-bg); }
    .ctx-menu-divider { height: 1px; background: var(--border); margin: 4px 6px; }

    /* ====== Status badges ====== */
    .badge { display: inline-flex; align-items: center; padding: 1px 8px; font-size: 10px; font-weight: 500; letter-spacing: 0.03em; border: 1px solid; }
    .badge-scheduled { border-color: var(--blue); color: var(--blue); }
    .badge-completed { border-color: var(--green); color: var(--green); }
    .badge-cancelled { border-color: var(--red); color: var(--red); }
    .badge-absent { border-color: var(--yellow); color: var(--yellow); }
    .badge-rescheduled { border-color: var(--accent); color: var(--accent); }

    /* ====== Form Elements ====== */
    input, select, textarea {
      font-family: var(--font); font-size: 13px; padding: 8px 12px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      outline: none; transition: border-color 0.15s; width: 100%;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--text); }
    input::placeholder, textarea::placeholder { color: var(--text-muted); }
    label { font-size: 11px; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 4px; }
    .field { margin-bottom: 14px; }
    .btn {
      padding: 8px 20px; font-size: 13px; font-weight: 450; cursor: pointer;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { border-color: var(--text); }
    .btn-primary { background: var(--text); color: var(--bg); border-color: var(--text); }
    .btn-primary:hover { opacity: 0.85; }
    .btn-sm { padding: 4px 12px; font-size: 11px; }
    .btn-accent { background: var(--accent); color: white; border-color: var(--accent); }
    .btn-accent:hover { background: var(--accent-hover); }

    /* ====== Student Cards ====== */
    .student-card { padding: 12px; border: 1px solid var(--border); cursor: pointer; transition: all 0.15s; margin-bottom: 6px; display: flex; align-items: center; gap: 12px; }
    .student-card:hover { border-color: var(--text); }
    .student-avatar { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); font-size: 14px; font-weight: 500; flex-shrink: 0; }
    .student-name { font-size: 13px; font-weight: 450; }
    .student-meta { font-size: 11px; color: var(--text-secondary); }

    /* ====== Scrollbar ====== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ====== Utility ====== */
    .page-enter { animation: fadeUp 0.3s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .animate-scale-in { animation: fadeUp 0.25s ease both; }
    .hover-lift { transition: border-color 0.15s; }
    .hover-lift:hover { border-color: var(--text); }

    /* ====== Search ====== */
    .search-box { position: relative; }
    .search-box input { padding-left: 30px; font-size: 12px; width: 200px; }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 13px; pointer-events: none; }

    /* ====== FAB ====== */
    .fab {
      position: fixed; bottom: 24px; right: 24px;
      width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
      z-index: 40; cursor: pointer; color: var(--bg);
      background: var(--text); border: none;
      transition: all 0.2s;
    }
    .fab:hover { background: var(--accent); }
    .fab:active { transform: scale(0.95); }

    /* ====== Legacy compatibility (mapped to old class names used in JS templates) ====== */
    .cal-floating { border: 1px solid var(--border); }
    .glass-card { border: 1px solid var(--border); padding: 16px; }
    .nav-pill { padding: 6px 14px; font-size: 13px; color: var(--text-secondary); cursor: pointer; background: none; border: none; transition: color 0.15s; }
    .nav-pill:hover { color: var(--text); }
    .nav-pill.active { color: var(--accent); }
    .gradient-text { color: var(--accent); }
    .gradient-bg, .gradient-warm, .gradient-cool, .gradient-rose { background: var(--accent); }
    .cal-slot { border-bottom: 1px solid var(--border); min-height: 44px; cursor: pointer; }
    .cal-time { font-size: 11px; color: var(--text-muted); }
    .lesson-pill { padding: 2px 8px; font-size: 11px; border-left: 3px solid var(--accent); background: var(--accent-light); cursor: pointer; display: inline-block; margin: 1px 0; }
    .mobile-nav { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
    .mobile-nav.open { pointer-events: auto; }
    .mobile-nav-backdrop { position: absolute; inset: 0; background: rgba(26,26,26,0.3); opacity: 0; transition: opacity 0.25s; }
    .mobile-nav.open .mobile-nav-backdrop { opacity: 1; }
    .mobile-nav-panel { position: absolute; top: 0; left: 0; bottom: 0; width: 280px; background: var(--bg); border-right: 1px solid var(--border); transform: translateX(-100%); transition: transform 0.3s ease; padding: 24px; }
    .mobile-nav.open .mobile-nav-panel { transform: translateX(0); }

    /* ====== Enhanced Calendar Week Helpers ====== */
    .cal-week-body { position: relative; min-height: 100%; }
    .week-hour-line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); pointer-events: none; }
    .week-half-line { position: absolute; left: 60px; right: 0; border-top: 1px dashed var(--border); pointer-events: none; opacity: 0.4; }

    /* ====== Week Lesson Blocks ====== */
    .week-lesson-block {
      position: absolute; left: 2px; right: 2px;
      padding: 3px 6px; font-size: 11px; font-weight: 500;
      cursor: pointer; overflow: hidden;
      transition: all 0.15s; z-index: 10; color: #fff;
      border-left: 3px solid rgba(0,0,0,0.15);
    }
    .week-lesson-block:hover { filter: brightness(1.08); z-index: 20; }
    .week-lesson-block .wl-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .week-lesson-block .wl-time { font-size: 10px; opacity: 0.85; }
    .week-lesson-block .wl-paydue { position: absolute; top: 3px; right: 4px; font-size: 10px; }
    .week-lesson-block .wl-type-badge {
      display: inline-block; font-size: 9px; font-weight: 700;
      padding: 0px 4px; border-radius: 2px; background: rgba(0,0,0,0.22); color: #fff;
      margin-left: 4px; vertical-align: middle;
    }
    .week-lesson-block .wl-note-ind {
      position: absolute; bottom: 2px; right: 4px; font-size: 10px; opacity: 0.8;
    }

    /* ====== Month Cells ====== */
    .month-cell .mc-events { display: flex; flex-direction: column; gap: 1px; }
    .month-cell .mc-event {
      font-size: 10px; padding: 1px 4px; border-left: 2px solid var(--accent);
      background: var(--accent-light); cursor: pointer; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; transition: background 0.1s;
      margin-bottom: 1px;
    }
    .month-cell .mc-event:hover { background: rgba(201,101,85,0.15); }
    .month-cell .mc-event.completed { border-left-color: var(--green); background: rgba(74,138,106,0.08); color: var(--green); }
    .month-cell .mc-event.cancelled { border-left-color: var(--red); background: rgba(201,85,85,0.08); color: var(--red); text-decoration: line-through; }
    .month-cell .mc-event.absent { border-left-color: var(--yellow); background: rgba(201,160,69,0.08); color: var(--yellow); }
    .month-cell .mc-event.custom { border-left-color: var(--blue); background: rgba(85,119,170,0.08); color: var(--blue); }
    .month-cell .mc-more { font-size: 9px; font-weight: 600; color: var(--text-muted); cursor: pointer; padding: 1px 4px; }
    .month-cell .mc-more:hover { color: var(--accent); }
    .month-cell .mc-lesson-count {
      position: absolute; bottom: 4px; right: 5px;
      font-size: 9px; font-weight: 600; color: var(--text-muted);
      background: var(--bg); padding: 1px 5px;
    }

    /* ====== Lesson Info Popup (from teacher calendar) ====== */
    .lesson-popup {
      position: fixed; z-index: 250; min-width: 280px; max-width: 340px;
      background: var(--bg); border: 1px solid var(--border);
      animation: popupIn 0.2s ease both;
      transform-origin: top left;
    }
    @keyframes popupIn { from { opacity: 0; transform: scale(0.95) translateY(-4px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .lesson-popup .lp-band { height: 4px; width: 100%; }
    .lesson-popup .lp-body { padding: 12px 16px; }
    .lesson-popup .lp-title { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
    .lesson-popup .lp-sub { font-size: 11px; color: var(--text-secondary); margin-bottom: 8px; }
    .lesson-popup .lp-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); padding: 2px 0; }
    .lesson-popup .lp-row strong { color: var(--text); font-weight: 500; }
    .lesson-popup .lp-close {
      position: absolute; top: 8px; right: 8px;
      width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
      border: none; background: none; cursor: pointer; color: var(--text-muted); font-size: 14px;
      transition: color 0.15s;
    }
    .lesson-popup .lp-close:hover { color: var(--text); }

    /* ====== Now Line ====== */
    .week-now-line {
      position: absolute; left: 0; right: 0; height: 2px; z-index: 50;
      pointer-events: none; display: flex; align-items: center;
    }
    .week-now-line-bar { flex: 1; height: 1px; background: var(--accent); }
    .week-now-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-left: -1px; }
    .week-now-label {
      background: var(--accent); color: #fff; font-size: 9px; font-weight: 600;
      padding: 1px 5px; white-space: nowrap; font-variant-numeric: tabular-nums;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div class="toast-container" id="toast-container"></div>

  <script>
  // ==================== UTILITIES ====================

    const symbols = { UAH: '₴', USD: '$', EUR: '€', GBP: '£' };
    return `${(symbols[currency] || currency)} ${Number(amount).toLocaleString('uk-UA', {minimumFractionDigits: 0, maximumFractionDigits: 2})}`;
  };
  const formatDate = (d, short = false) => {
    if (!d) return '';
    const date = new Date(d);
    return short ? date.toLocaleDateString('en-GB', {day:'2-digit',month:'short'}) : date.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'});
  };
  const formatTime = (d) => {
    if (!d) return '';
    const date = new Date(d);
    return date.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'});
  };
  const formatDateTime = (d) => `${formatDate(d, true)} ${formatTime(d)}`;
  const isToday = (d) => { const t = new Date(), dd = new Date(d); return t.toDateString() === dd.toDateString(); };
  const isThisWeek = (d) => { const now = new Date(), dd = new Date(d), start = new Date(now); start.setDate(now.getDate()-now.getDay()); start.setHours(0,0,0,0); const end = new Date(start); end.setDate(start.getDate()+7); return dd >= start && dd < end; };
  const isThisMonth = (d) => { const t = new Date(), dd = new Date(d); return t.getMonth() === dd.getMonth() && t.getFullYear() === dd.getFullYear(); };
  const getDaysUntilBirthday = (dob) => {
    if (!dob) return null;
    const today = new Date(); today.setHours(0,0,0,0);
    const bday = new Date(today.getFullYear(), new Date(dob).getMonth(), new Date(dob).getDate());
    if (bday < today) bday.setFullYear(today.getFullYear() + 1);
    return Math.round((bday - today) / 86400000);
  };
  // Helper: check if a student has payment due for a lesson
  const needsPayment = (student, lesson) => {
    if (!student || !student.paymentSchedule || lesson.status !== 'completed') return false;
    const allLessons = store.getAll('lessons').filter(l => l.studentId === student.id && l.status === 'completed').sort((a,b) => new Date(a.startAt) - new Date(b.startAt));
    const allPayments = store.getAll('payments').filter(p => p.studentId === student.id && p.status === 'paid').sort((a,b) => new Date(a.paidAt) - new Date(b.paidAt));
    const lessonIdx = allLessons.findIndex(l => l.id === lesson.id);
    if (lessonIdx === -1) return false;
    // Count completed lessons after the last payment
    const lastPaymentDate = allPayments.length ? new Date(allPayments[allPayments.length-1].paidAt) : new Date(0);
    const lessonsSincePayment = allLessons.filter(l => new Date(l.startAt) > lastPaymentDate).length;

      const todayLessons = allLessons.filter(l => new Date(l.startAt).toDateString() === lessonDate && new Date(l.startAt) > lastPaymentDate);

    }
    if (student.paymentSchedule === 'every_n') return lessonsSincePayment >= (student.paymentInterval || 5);

  };

  const userCol = (uid, col) => db.collection('users').doc(uid).collection(col);
  const userDoc = (uid, col, id) => userCol(uid, col).doc(id);
  const userSettings = (uid) => db.doc('users/' + uid + '/settings/app');

  class Store {
    constructor() {
      this._cache = { settings: {} };
      COLLECTIONS.forEach(c => this._cache[c] = []);
      this._unsubs = [];
      this._uid = null;
    }

    async init(uid) {
      this._uid = uid;
      const col = (c) => userCol(uid, c);
      const settingsRef = userSettings(uid);

      // Load all collections from Firestore into cache + attach listeners
      const loadCollection = (name) => {
        return col(name).get().then(snapshot => {
          this._cache[name] = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          // Real-time listener (skip event if data hasn't changed — prevents double re-renders)
          const unsub = col(name).onSnapshot(snap => {
            let changed = false;
            snap.docChanges().forEach(change => {
              const data = { id: change.doc.id, ...change.doc.data() };
              const idx = this._cache[name].findIndex(i => i.id === change.doc.id);
              if (change.type === 'added' || change.type === 'modified') {
                if (idx >= 0) {
                  if (JSON.stringify(this._cache[name][idx]) !== JSON.stringify(data)) {
                    this._cache[name][idx] = data;
                    changed = true;
                  }
                } else {
                  this._cache[name].push(data);
                  changed = true;
                }
              } else if (change.type === 'removed') {
                if (idx >= 0) {
                  this._cache[name].splice(idx, 1);
                  changed = true;
                }
              }
            });
            if (changed) EventBus.emit(name + 'Changed');
          });
          this._unsubs.push(unsub);
        });
      };

      await Promise.all(COLLECTIONS.map(loadCollection));

      // Load settings
      try {
        const settingsSnap = await settingsRef.get();
        if (settingsSnap.exists) this._cache.settings = settingsSnap.data();
      } catch(e) { /* settings doc may not exist yet */ }

      // Listen for remote settings changes (skip if unchanged — prevents double-render)
      const settingsUnsub = settingsRef.onSnapshot(snap => {
        if (snap.exists) {
          const data = snap.data();
          if (JSON.stringify(this._cache.settings) !== JSON.stringify(data)) {
            this._cache.settings = data;
            EventBus.emit('settingsChanged');
          }
        }
      });
      this._unsubs.push(settingsUnsub);

      // Re-apply theme after loading remote settings
      applyTheme();
    }

    cleanup() {
      this._unsubs.forEach(u => u());
      this._unsubs = [];
    }

    getAll(collection) { return this._cache[collection] || []; }
    getById(collection, id) { return (this._cache[collection] || []).find(i => i.id === id) || null; }
    getSettings() { return this._cache.settings || {}; }

    saveSettings(s) {
      this._cache.settings = s;
      userSettings(this._uid).set(s);
      EventBus.emit('settingsChanged');
    }

    create(collection, item) {
      const id = item.id || uuid();
      const now = new Date().toISOString();
      const data = { ...item, id, createdAt: item.createdAt || now };
      this._cache[collection] = this._cache[collection] || [];
      this._cache[collection].push(data);
      EventBus.emit(collection + 'Changed');
      userDoc(this._uid, collection, id).set(data);
      return data;
    }

    update(collection, id, updates) {
      const items = this._cache[collection] || [];
      const idx = items.findIndex(i => i.id === id);
      if (idx === -1) return null;
      const now = new Date().toISOString();
      const updated = { ...items[idx], ...updates, updatedAt: now };
      items[idx] = updated;
      EventBus.emit(collection + 'Changed');
      userDoc(this._uid, collection, id).update(updates);
      return updated;
    }

    delete(collection, id) {
      this._cache[collection] = (this._cache[collection] || []).filter(i => i.id !== id);
      EventBus.emit(collection + 'Changed');
      userDoc(this._uid, collection, id).delete();
    }

    exportAll() {
      const data = {};
      for (const col of COLLECTIONS) data[col] = this._cache[col];
      data.settings = this._cache.settings;
      return data;
    }

    async importAll(data) {
      const writes = [];
      for (const [key, val] of Object.entries(data)) {
        if (key === 'settings' && typeof val === 'object') {
          this._cache.settings = val;
          writes.push(userSettings(this._uid).set(val));
        } else if (COLLECTIONS.includes(key) && Array.isArray(val)) {
          this._cache[key] = val;
          val.forEach(item => {
            if (item.id) writes.push(userDoc(this._uid, key, item.id).set(item));
          });
        }
      }
      await Promise.all(writes);
      EventBus.emit('dataImported');
    }
  }

  const store = new Store();

  // ==================== EVENT BUS ====================
  const EventBus = {
    _listeners: {},
    on(event, fn) { (this._listeners[event] = this._listeners[event] || []).push(fn); },
    off(event, fn) { if (this._listeners[event]) this._listeners[event] = this._listeners[event].filter(f => f !== fn); },
    emit(event, data) { (this._listeners[event] || []).forEach(fn => fn(data)); }
  };

  // ==================== ROUTER ====================
  const Router = {
    routes: {},
    current: null,
    params: {},
    register(hash, handler) { this.routes[hash] = handler; },
    navigate(hash) { window.location.hash = hash; },
    start() {
      const handleRoute = () => {
        const hash = window.location.hash.slice(1) || 'calendar';
        const parts = hash.split('/');
        const base = parts[0];
        this.params = { id: parts[1] || null };
        this.current = base;
        const handler = this.routes[base] || this.routes['dashboard'];
        handler(this.params);
      };
      window.addEventListener('hashchange', () => {
        document.getElementById('mobile-nav')?.classList.remove('open');
        handleRoute();
      });
      handleRoute();
    }
  };

  document.addEventListener('click', (e) => {

  // ==================== TOAST ====================
  const Toast = {
    show(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.textContent = msg;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => el.remove(), 3000);

    success(msg) { this.show(msg, 'success'); },

  // ==================== MODAL ====================
  const Modal = {
    open(content, opts = {}) {
      const root = document.getElementById('modal-root');
      root.innerHTML = `<div class="modal-overlay active" id="modal-overlay"><div class="modal-content bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full ${opts.size === 'lg' ? 'max-w-2xl' : opts.size === 'xl' ? 'max-w-4xl' : 'max-w-md'} mx-4 p-6">${content}</div></div>`;
      document.getElementById('modal-overlay').addEventListener('click', (e) => { if (e.target.id === 'modal-overlay') this.close(); });
    },
    close() {
      const overlay = document.getElementById('modal-overlay');
      if (overlay) { overlay.classList.remove('active'); setTimeout(() => document.getElementById('modal-root').innerHTML = '', 200); }
    }
  };

  // ==================== CONFIRM MODAL (replaces browser confirm()) ====================
  const ConfirmModal = {
    show(message, title = '') {
      return new Promise(resolve => {
        this._resolve = resolve;
        Modal.open(`
          <div class="text-center">
            <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-red-50 dark:bg-red-900/20 flex items-center justify-center">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
            </div>
            ${title ? `<h3 class="text-lg font-bold mb-2">${title}</h3>` : ''}
            <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">${message}</p>
            <div class="flex gap-3 justify-center">
              <button onclick="ConfirmModal._handle(false)" class="px-5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-700 transition">${t('cancel')}</button>
              <button onclick="ConfirmModal._handle(true)" class="px-5 py-2.5 rounded-xl gradient-bg text-white text-sm font-medium hover:opacity-90 transition shadow-lg shadow-primary-500/25">${t('confirmBtn')}</button>
            </div>
          </div>
        `, { size: 'sm' });
      });
    },
    _handle(value) {
      // Clear immediately (don't use Modal.close() — it has a 200ms timeout that can break chained modals)
      const overlay = document.getElementById('modal-overlay');
      if (overlay) overlay.classList.remove('active');
      document.getElementById('modal-root').innerHTML = '';
      if (this._resolve) {
        this._resolve(value);
        this._resolve = null;
      }
    }

  // ==================== SETTINGS HELPER ====================
  const getSettings = () => ({ name: 'Tutor', currency: 'UAH', theme: 'light', ...store.getSettings() });
  const applyTheme = () => {
    const s = getSettings();
    document.documentElement.classList.toggle('dark', s.theme === 'dark');
  };
  applyTheme();

  // ==================== NOTIFICATIONS ENGINE ====================
  const NotificationEngine = {
    generate() {
      const students = store.getAll('students');
      const packages = store.getAll('packages');
      const lessons = store.getAll('lessons');
      const existing = store.getAll('notifications');
      const newNotifs = [];

      // Birthday alerts
      students.forEach(s => {
        const days = getDaysUntilBirthday(s.dateOfBirth);
        if (days !== null && days <= 7) {
          const exists = existing.find(n => n.type === 'birthday' && n.relatedId === s.id && (new Date() - new Date(n.createdAt)) < 86400000);
          if (!exists) {
            newNotifs.push({ id: uuid(), type: 'birthday', title: 'Upcoming Birthday', message: `${s.name}'s birthday ${days === 0 ? 'is today!' : `in ${days} day${days>1?'s':''}`}`, isRead: false, relatedEntity: 'student', relatedId: s.id, createdAt: new Date().toISOString() });
          }
        }
      });

      // Package ending alerts
      packages.filter(p => p.status === 'active').forEach(p => {
        const remaining = p.totalLessons - p.usedLessons;
        if (remaining <= 2 && remaining > 0) {
          const student = students.find(s => s.id === p.studentId);
          const exists = existing.find(n => n.type === 'package_ending' && n.relatedId === p.id && (new Date() - new Date(n.createdAt)) < 86400000);
          if (!exists && student) {
            newNotifs.push({ id: uuid(), type: 'package_ending', title: 'Package Running Low', message: `${student.name} has ${remaining} lesson${remaining>1?'s':''} left in package`, isRead: false, relatedEntity: 'package', relatedId: p.id, createdAt: new Date().toISOString() });
          }
        }
      });

      // Debt alerts
      const payments = store.getAll('payments');
      const debts = payments.filter(p => p.status === 'debt');
      if (debts.length > 0) {
        const exists = existing.find(n => n.type === 'debt' && (new Date() - new Date(n.createdAt)) < 86400000);
        if (!exists) {
          const totalDebt = debts.reduce((sum, d) => sum + d.amount, 0);
          newNotifs.push({ id: uuid(), type: 'debt', title: 'Outstanding Debts', message: `Total debt: ${formatCurrency(totalDebt)} across ${debts.length} payment(s)`, isRead: false, relatedEntity: 'payment', relatedId: null, createdAt: new Date().toISOString() });
        }
      }

      newNotifs.forEach(n => store.create('notifications', n));
    },

                <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-700/50">

                <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-700/50">
                  <div class="text-xs text-slate-400">${t('totalDebtTitle')}</div>

                </div>
              </div>
            </div>
          </div>
        </div>`;

      AppShell.render(content);
      this.renderCharts(payments, lessons, students, settings);
    },
    renderCharts(payments, lessons, students, settings) {
      // Income bar chart (last 6 months)
      const incomeCtx = document.getElementById('incomeChart');
      if (incomeCtx) {
        const months = [];
        for (let i = 5; i >= 0; i--) {
          const d = new Date(); d.setMonth(d.getMonth() - i);
          months.push({ label: d.toLocaleString('en', { month: 'short' }), month: d.getMonth(), year: d.getFullYear() });
        }
        const incomeData = months.map(m => payments.filter(p => p.status === 'paid' && new Date(p.paidAt).getMonth() === m.month && new Date(p.paidAt).getFullYear() === m.year).reduce((s, p) => s + Number(p.amount), 0));
        const isDark = getSettings().theme === 'dark';
        this.chartInstances.push(new Chart(incomeCtx, {
          type: 'bar',
          data: { labels: months.map(m => m.label), datasets: [{ label: t('income'), data: incomeData, backgroundColor: 'rgba(0,123,255,0.3)', borderColor: '#007BFF', borderWidth: 2, borderRadius: 8 }] },
          options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: isDark ? '#334155' : '#f1f5f9' }, ticks: { color: isDark ? '#94a3b8' : '#64748b' } }, x: { grid: { display: false }, ticks: { color: isDark ? '#94a3b8' : '#64748b' } } } }
        }));
      }
      // Workload pie
      const workloadCtx = document.getElementById('workloadChart');
      if (workloadCtx) {
        const studentLessonCounts = {};
        lessons.filter(l => l.status === 'completed' && isThisMonth(l.startAt)).forEach(l => {
          const st = store.getById('students', l.studentId);
          const name = st ? st.name : t('unknown');
          studentLessonCounts[name] = (studentLessonCounts[name] || 0) + 1;
        });
        const labels = Object.keys(studentLessonCounts).slice(0, 6);
        const data = labels.map(l => studentLessonCounts[l]);
        const colors = ['#007BFF', '#00D4FF', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];
        const isDark = getSettings().theme === 'dark';
        if (labels.length > 0) {
          this.chartInstances.push(new Chart(workloadCtx, {
            type: 'doughnut',
            data: { labels, datasets: [{ data, backgroundColor: colors.slice(0, labels.length), borderWidth: 0 }] },
            options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: isDark ? '#94a3b8' : '#64748b', padding: 12, font: { size: 11 } } } } }
          }));
        } else {
          workloadCtx.parentElement.innerHTML += `<p class="text-sm text-slate-400 text-center mt-4">${t('noLessonsMonth')}</p>`;
        }
      }
    }
  };

    save(id) {
      const form = document.querySelector('.modal-content form');
      const data = Object.fromEntries(new FormData(form));
      data.pricePerLesson = Number(data.pricePerLesson) || 0;
      data.paymentInterval = Number(data.paymentInterval) || 5;
      if (id) {
        store.update('students', id, data);
        Toast.success(t('studentUpdated'));

        const student = store.create('students', { ...data, isActive: true });

      }
      Modal.close();
      Router.navigate('students');

        case 'payments': return `
          <div class="flex justify-end mb-3"><button onclick="PaymentsView.openForm(null, '${id}')" class="gradient-bg text-white px-3 py-1.5 rounded-xl text-sm font-semibold flex items-center gap-1">${Icons.plus} ${t('recordPayment')}</button></div>
          ${payments.length === 0 ? `<p class="text-sm text-slate-400 text-center py-8">${t('noPaymentsYet')}</p>` : `<div class="space-y-2">${payments.sort((a,b) => new Date(b.paidAt) - new Date(a.paidAt)).map(p => `
            <div class="bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-100 dark:border-slate-700 flex justify-between items-center">
              <div>
                <div class="font-semibold text-sm">${formatCurrency(p.amount, settings.currency)}</div>
                <div class="text-xs text-slate-400">${p.type} · ${p.method || ''} · ${formatDate(p.paidAt)}</div>
              </div>
              <span class="badge ${p.status === 'paid' ? 'badge-completed' : p.status === 'debt' ? 'badge-cancelled' : 'badge-absent'}">${p.status}</span>
            </div>
          `).join('')}</div>`}`;
        case 'lessons': return `
          ${lessons.length === 0 ? `<p class="text-sm text-slate-400 text-center py-8">${t('noLessonsYet')}</p>` : `<div class="space-y-2">${lessons.sort((a,b) => new Date(b.startAt) - new Date(a.startAt)).map(l => `
            <div class="bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-100 dark:border-slate-700 flex justify-between items-center">
              <div>
                <div class="font-semibold text-sm">${l.title || t('lesson')}</div>
                <div class="text-xs text-slate-400">${formatDateTime(l.startAt)} — ${formatTime(l.endAt)}</div>
              </div>
              <span class="badge badge-${l.status}">${l.status}</span>
            </div>
          `).join('')}</div>`}`;
      }
    },
    addPackage(studentId) {
      Modal.open(`
        <h3 class="text-lg font-bold mb-4">${t('createPackage')}</h3>
        <form onsubmit="event.preventDefault();StudentProfileView.savePackage('${studentId}')" class="space-y-3">
          <div><label class="text-xs font-semibold text-slate-500">${t('numberOfLessons')}</label><input name="totalLessons" type="number" min="1" required value="10" class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"></div>
          <div><label class="text-xs font-semibold text-slate-500">${t('totalPricePaid')}</label><input name="pricePaid" type="number" min="0" required class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"></div>
          <div><label class="text-xs font-semibold text-slate-500">${t('expires')}</label><input name="expiresAt" type="date" class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500"></div>
          <button type="submit" class="w-full gradient-bg text-white py-2.5 rounded-xl font-semibold text-sm hover:opacity-90">${t('createPackage')}</button>
        </form>
      `);
    },
    savePackage(studentId) {
      const form = document.querySelector('.modal-content form');
      const data = Object.fromEntries(new FormData(form));
      const totalLessons = Number(data.totalLessons);
      const pricePaid = Number(data.pricePaid);
      const pkg = store.create('packages', { studentId, totalLessons, usedLessons: 0, pricePaid, pricePerLesson: pricePaid / totalLessons, purchasedAt: new Date().toISOString(), expiresAt: data.expiresAt || null, status: 'active' });
      store.create('payments', { studentId, packageId: pkg.id, amount: pricePaid, type: 'package', status: 'paid', method: 'cash', paidAt: new Date().toISOString() });
      Toast.success(t('packageCreated'));
      Modal.close();
      Router.navigate('student/' + studentId);
    }
  };

  // ==================== CALENDAR VIEW ====================
  // ====== Lesson Types (from teacher calendar) ======
  const LESSON_TYPES = [
    {id:'lesson',label:'Lesson'},{id:'test',label:'Test'},{id:'lab',label:'Lab'},{id:'control',label:'Control'},
    {id:'reading',label:'Reading'},{id:'listening',label:'Listening'},{id:'writing',label:'Writing'},{id:'speaking',label:'Speaking'},
    {id:'dictation',label:'Dictation'},{id:'independent',label:'Independent'},{id:'practical',label:'Practical'},
    {id:'creative',label:'Creative'}
  ];
  const CUSTOM_EVENTS_KEY = 'tb_customEvents';
  let customEvents = [];
  function loadCustomEvents() { try{const s=localStorage.getItem(CUSTOM_EVENTS_KEY);if(s)customEvents=JSON.parse(s)}catch(e){customEvents=[]} }
  function saveCustomEvents() { try{localStorage.setItem(CUSTOM_EVENTS_KEY,JSON.stringify(customEvents))}catch(e){} }
  function getCustomEventsForDate(dk) {
    const parts=dk.split('-');
    const d=new Date(+parts[0],+parts[1],+parts[2]);
    const wi=(d.getDay()+6)%7;
    return customEvents.filter(ev => {
      if(ev.recurring) {
        const ep=ev.date.split('-');
        const ed=new Date(+ep[0],+ep[1],+ep[2]);
        return (ed.getDay()+6)%7===wi && d>=ed;
      }
      return ev.date===dk;
    });
  }
  loadCustomEvents();

  function dateKey(d) { return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
  function getMonday(d) { const date=new Date(d); const day=date.getDay(); date.setDate(date.getDate()-day+(day===0?-6:1)); date.setHours(0,0,0,0); return date; }
  function timeToMinutes(t) { const[h,m]=t.split(':').map(Number); return h*60+m; }
  function getLessonType(lesson) { return lesson.lessonType || 'lesson'; }
  function getTypeInfo(id) { return LESSON_TYPES.find(t=>t.id===id) || LESSON_TYPES[0]; }

  const CalendarView = {
    viewMode: 'week',
    currentDate: new Date(),
    DAY_START: 6,
    DAY_END: 21,
    HOUR_HEIGHT: 60,

    render() {
      const lessons = store.getAll('lessons');
      const students = store.getAll('students');
      const monthName = this.currentDate.toLocaleString(getLang()==='uk'?'uk':getLang()==='ru'?'ru':getLang()==='de'?'de':getLang()==='pl'?'pl':'en', { month: 'long', year: 'numeric' });
      const content = `
        <div class="cal-header">
          <div class="cal-title">${monthName}</div>
          <div class="cal-nav">
            <button class="cal-today-btn" onclick="CalendarView.currentDate=new Date();CalendarView.render()">${t('today')}</button>
            <button class="cal-nav-btn" onclick="CalendarView.navigate(-1)">‹</button>
            <button class="cal-nav-btn" onclick="CalendarView.navigate(1)">›</button>
            <div class="view-toggle">
              <button onclick="CalendarView.viewMode='day';CalendarView.render()" class="${this.viewMode === 'day' ? 'active' : ''}">${t('day')}</button>
              <button onclick="CalendarView.viewMode='week';CalendarView.render()" class="${this.viewMode === 'week' ? 'active' : ''}">${t('week')}</button>
              <button onclick="CalendarView.viewMode='month';CalendarView.render()" class="${this.viewMode === 'month' ? 'active' : ''}">${t('month')}</button>
            </div>
          </div>
        </div>
        <div style="flex:1;overflow:hidden;position:relative">
          ${this.viewMode === 'day' ? this.renderDay(lessons, students) : this.viewMode === 'week' ? this.renderWeek(lessons, students) : this.renderMonth(lessons, students)}
        </div>
        <button onclick="CalendarView.openForm()" class="fab">+</button>`;
      AppShell.render(content);
    },

    renderWeek(lessons, students) {
      const startOfWeek = getMonday(this.currentDate);
      const totalH = this.DAY_END - this.DAY_START;
      const totalPx = totalH * this.HOUR_HEIGHT;
      const lang = getLang();
      let html = '<div class="cal-week-grid" style="grid-template-columns:60px repeat(7,1fr)">';

      // Day headers
      html += '<div class="cal-week-header"></div>';
      for (let d = 0; d < 7; d++) {
        const day = new Date(startOfWeek);
        day.setDate(startOfWeek.getDate() + d);
        const today = isToday(day);
        const wi = (day.getDay()+6)%7;
        html += `<div class="cal-week-header ${today?'today-col':''} ${wi>=5?'weekend-col':''}" style="${wi>=5?'opacity:0.5':''}">
          ${day.toLocaleDateString(lang, {weekday:'short'})} <strong>${day.getDate()}</strong>
        </div>`;
      }

      // Time labels + day columns
      for (let d = -1; d < 7; d++) {
        if (d === -1) {
          // Time column
          html += '<div class="cal-time-slot" style="grid-column:1;border-right:1px solid var(--border);position:relative;height:'+totalPx+'px;border-bottom:none">';
          for (let h = this.DAY_START; h <= this.DAY_END; h++) {
            html += `<div class="cal-time-label" style="top:${(h-this.DAY_START)*this.HOUR_HEIGHT}px">${String(h).padStart(2,'0')}:00</div>`;
          }
          html += '</div>';
        } else {
          const day = new Date(startOfWeek);
          day.setDate(startOfWeek.getDate() + d);
          const dk = dateKey(day);
          const today = isToday(day);
          const wi = (day.getDay()+6)%7;
          html += `<div class="cal-day-slot ${today?'today-slot':''}" style="height:${totalPx}px;position:relative" data-dk="${dk}">`;

          // Hour lines
          for (let h = this.DAY_START; h <= this.DAY_END; h++) {
            const top = (h - this.DAY_START) * this.HOUR_HEIGHT;
            html += `<div style="position:absolute;left:0;right:0;top:${top}px;border-top:1px solid var(--border);pointer-events:none"></div>`;
            if (h < this.DAY_END) {
              html += `<div style="position:absolute;left:0;right:0;top:${top+30}px;border-top:1px dashed var(--border);pointer-events:none;opacity:0.3"></div>`;
            }
          }

          // Lessons for this day
          const dayLessons = lessons.filter(l => new Date(l.startAt).toDateString() === day.toDateString());
          dayLessons.forEach(l => {
            const st = students.find(s => s.id === l.studentId);
            const startMin = new Date(l.startAt).getHours()*60 + new Date(l.startAt).getMinutes();
            const endMin = new Date(l.endAt).getHours()*60 + new Date(l.endAt).getMinutes();
            const top = ((startMin/60) - this.DAY_START) * this.HOUR_HEIGHT;
            const height = Math.max(((endMin - startMin)/60) * this.HOUR_HEIGHT, 20);
            if (top < 0 || top > totalPx) return;
            const payDue = st && needsPayment(st, l);
            const typeInfo = getTypeInfo(getLessonType(l));
            const isCustomType = l.lessonType && l.lessonType !== 'lesson';
            const statusColors = { scheduled: 'var(--blue)', completed: 'var(--green)', cancelled: 'var(--red)', absent: 'var(--yellow)', rescheduled: 'var(--accent)' };
            const bgColor = payDue ? 'var(--red)' : (statusColors[l.status] || 'var(--blue)');
            html += `<div class="week-lesson-block" style="top:${top}px;height:${height}px;background:${bgColor}" 
              onclick="event.stopPropagation();CalendarView.openForm('${l.id}')" 
              oncontextmenu="event.preventDefault();event.stopPropagation();CalendarView.showContextMenu('${l.id}',event)"
              onmouseenter="CalendarView.showLessonPopup('${l.id}',event)"
              data-id="${l.id}">
              ${isCustomType ? `<span class="wl-type-badge">${typeInfo.label}</span>` : ''}
              <div class="wl-title">${payDue ? '💵 ' : ''}${st ? st.name : t('lesson')}</div>
              <div class="wl-time">${formatTime(l.startAt)}${l.title ? ` · ${l.title}` : ''}</div>
          ${payDue ? `<span class="wl-paydue">⚠️</span>` : ''}
        </div>`;
          });

          // Custom events for this day
          const cEvs = getCustomEventsForDate(dk);
          cEvs.forEach(ev => {
            const sm = timeToMinutes(ev.startTime);
            const em = timeToMinutes(ev.endTime);
            const top = ((sm/60) - this.DAY_START) * this.HOUR_HEIGHT;
            const height = Math.max(((em - sm)/60) * this.HOUR_HEIGHT, 20);
            if (top < 0 || top > totalPx) return;
            html += `<div class="week-lesson-block" style="top:${top}px;height:${height}px;background:var(--blue)"
              onclick="event.stopPropagation();CalendarView.editCustomEvent('${ev.id}')"
              oncontextmenu="event.preventDefault();event.stopPropagation();CalendarView.deleteCustomEvent('${ev.id}')">
              <div class="wl-title">📌 ${ev.title}</div>
              <div class="wl-time">${ev.startTime} - ${ev.endTime}</div>
            </div>`;
          });

          // Click to add lesson
          html += `<div style="position:absolute;inset:0;cursor:pointer" onclick="CalendarView.openForm(null, '${day.toISOString()}')"></div>`;
          html += '</div>';
        }
      }

      html += '</div>';

      // Now line
      setTimeout(() => {
        const grid = document.querySelector('.cal-week-grid');
        if (!grid) return;
        const existing = document.getElementById('cal-now-line');
        if (existing) existing.remove();
        const now = new Date();
        const todayMidnight = new Date(); todayMidnight.setHours(0,0,0,0);
        let colIdx = -1;
        for (let i = 0; i < 7; i++) {
          const dt = new Date(getMonday(this.currentDate));
          dt.setDate(dt.getDate() + i);
          if (dt.getTime() === todayMidnight.getTime()) { colIdx = i + 1; break; }
        }
        if (colIdx < 0) return;
        const nm = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
        const top = ((nm/60) - this.DAY_START) * this.HOUR_HEIGHT;
        if (top < 0 || top > (this.DAY_END - this.DAY_START) * this.HOUR_HEIGHT) return;
        const nl = document.createElement('div');
        nl.id = 'cal-now-line';
        nl.style.cssText = `position:absolute;left:0;right:0;top:${top}px;z-index:50;pointer-events:none;display:flex;align-items:center`;
        nl.innerHTML = `<span style="background:var(--accent);color:#fff;font-size:9px;font-weight:600;padding:1px 5px;font-variant-numeric:tabular-nums">${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}</span><span style="flex:1;height:1px;background:var(--accent)"></span>`;
        grid.appendChild(nl);
      }, 50);

      return html;
    },

    renderDay(lessons, students) {
      const day = new Date(this.currentDate);
      const dk = dateKey(day);
      const totalH = this.DAY_END - this.DAY_START;
      const totalPx = totalH * this.HOUR_HEIGHT;
      const dateStr = day.toLocaleDateString(getLang(), { weekday: 'long', month: 'long', day: 'numeric' });
      let html = `<div style="height:100%;overflow-y:auto;position:relative">
        <div style="padding:8px 16px;font-size:12px;color:var(--text-secondary);border-bottom:1px solid var(--border)">${dateStr}</div>
        <div style="position:relative;height:${totalPx}px">`;

      for (let h = this.DAY_START; h <= this.DAY_END; h++) {
        const top = (h - this.DAY_START) * this.HOUR_HEIGHT;
        html += `<div style="position:absolute;left:60px;right:0;top:${top}px;border-top:1px solid var(--border)"></div>`;
        html += `<div style="position:absolute;left:0;top:${top - 6}px;width:56px;text-align:right;padding-right:8px;font-size:10px;color:var(--text-muted)">${String(h).padStart(2,'0')}:00</div>`;
      }

      const dayLessons = lessons.filter(l => new Date(l.startAt).toDateString() === day.toDateString());
      dayLessons.forEach(l => {
        const st = students.find(s => s.id === l.studentId);
        const startMin = new Date(l.startAt).getHours()*60 + new Date(l.startAt).getMinutes();
        const endMin = new Date(l.endAt).getHours()*60 + new Date(l.endAt).getMinutes();
        const top = ((startMin/60) - this.DAY_START) * this.HOUR_HEIGHT;
        const height = Math.max(((endMin - startMin)/60) * this.HOUR_HEIGHT, 20);
        if (top < 0 || top > totalPx) return;
        const payDue = st && needsPayment(st, l);
        html += `<div style="position:absolute;left:64px;right:8px;top:${top}px;height:${height}px;background:${payDue ? 'var(--red)' : 'var(--text)'};color:#fff;padding:2px 8px;font-size:11px;cursor:pointer;overflow:hidden;border-left:3px solid rgba(255,255,255,0.2)" 
          onclick="CalendarView.openForm('${l.id}')" 
          oncontextmenu="event.preventDefault();event.stopPropagation();CalendarView.showContextMenu('${l.id}',event)"
          onmouseenter="CalendarView.showLessonPopup('${l.id}',event)">
          <div style="font-weight:500">${payDue ? '💵 ' : ''}${st ? st.name : t('lesson')}${l.title ? ` · ${l.title}` : ''}</div>
          <div style="font-size:10px;opacity:0.8">${formatTime(l.startAt)} - ${formatTime(l.endAt)}</div>
        </div>`;
      });

      // Custom events
      const cEvs = getCustomEventsForDate(dk);
      cEvs.forEach(ev => {
        const sm = timeToMinutes(ev.startTime);
        const em = timeToMinutes(ev.endTime);
        const top = ((sm/60) - this.DAY_START) * this.HOUR_HEIGHT;
        const height = Math.max(((em - sm)/60) * this.HOUR_HEIGHT, 20);
        if (top < 0 || top > totalPx) return;
        html += `<div style="position:absolute;left:64px;right:8px;top:${top}px;height:${height}px;background:var(--blue);color:#fff;padding:2px 8px;font-size:11px;cursor:pointer;overflow:hidden" onclick="CalendarView.editCustomEvent('${ev.id}')">📌 ${ev.title}<div style="font-size:10px;opacity:0.8">${ev.startTime} - ${ev.endTime}</div></div>`;
      });

      html += '</div></div>';
      return html;
    },

    renderMonth(lessons, students) {
      const year = this.currentDate.getFullYear();
      const month = this.currentDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startPad = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
      const totalCells = startPad + lastDay.getDate();
      const rows = Math.ceil(totalCells / 7);
      const totalDays = rows * 7;
      const today = new Date(); today.setHours(0,0,0,0);
      
      let html = '<div class="cal-month-grid" style="grid-template-rows:' + Array(rows+1).fill('auto').join(' ') + '">';
      // Day headers
      [t('mon'),t('tue'),t('wed'),t('thu'),t('fri'),t('sat'),t('sun')].forEach((d, i) => {
        html += `<div class="cal-week-header ${i >= 5 ? '' : ''}" style="border-bottom:1px solid var(--border);padding:6px 0;font-size:11px">${d}</div>`;
      });
      // Empty cells
      for (let i = 0; i < startPad; i++) {
        const prevMonthDay = new Date(year, month, 0);
        prevMonthDay.setDate(prevMonthDay.getDate() - startPad + 1 + i);
        html += `<div class="month-cell other-month"><div class="month-date" style="color:var(--text-muted)">${prevMonthDay.getDate()}</div></div>`;
      }
      // Day cells
      for (let d = 1; d <= lastDay.getDate(); d++) {
        const date = new Date(year, month, d);
        const isT = date.getTime() === today.getTime();
        const dayLessons = lessons.filter(l => new Date(l.startAt).toDateString() === date.toDateString());
        const dk = dateKey(date);
        const cEvs = getCustomEventsForDate(dk);
        const hasCustom = cEvs.length > 0;
        
        html += `<div class="month-cell ${isT ? 'today-cell' : ''}" onclick="CalendarView.currentDate=new Date(${year},${month},${d});CalendarView.viewMode='day';CalendarView.render()">`;
        html += `<div class="month-date ${isT ? 'today' : ''}">${d}</div>`;
        
        // Show lessons as chips (max 2)
        if (dayLessons.length > 0 || hasCustom) {
          html += '<div class="mc-events">';
          const maxShow = 2;
          let shown = 0;
          for (let li = 0; li < Math.min(dayLessons.length, maxShow); li++) {
            const l = dayLessons[li];
            const st = students.find(s => s.id === l.studentId);
            const payDue = st && needsPayment(st, l);
            html += `<div class="mc-event ${l.status}" onclick="event.stopPropagation();CalendarView.openForm('${l.id}')" oncontextmenu="event.preventDefault();event.stopPropagation();CalendarView.showContextMenu('${l.id}',event)">${payDue ? '💵' : ''}${formatTime(l.startAt)} ${st ? st.name : ''}</div>`;
            shown++;
          }
          // Custom events
          for (let ci = 0; ci < Math.min(cEvs.length, Math.max(0, maxShow - shown)); ci++) {
            const ev = cEvs[ci];
            html += `<div class="mc-event custom" onclick="event.stopPropagation();CalendarView.editCustomEvent('${ev.id}')">📌 ${ev.title}</div>`;
            shown++;
          }
          // More count
          const remaining = dayLessons.length + cEvs.length - shown;
          if (remaining > 0) {
            html += `<div class="mc-more" onclick="event.stopPropagation();CalendarView.currentDate=new Date(${year},${month},${d});CalendarView.viewMode='day';CalendarView.render()">+${remaining} more</div>`;
          }
          // Lesson count badge
          if (dayLessons.length > 0) {
            html += `<span class="mc-lesson-count">${dayLessons.length}</span>`;
          }
          html += '</div>';
        }
        html += '</div>';
      }
      // Fill remaining cells
      const used = startPad + lastDay.getDate();
      const remaining = rows * 7 - used;
      for (let i = 1; i <= remaining; i++) {
        html += `<div class="month-cell other-month"><div class="month-date" style="color:var(--text-muted)">${i}</div></div>`;
      }
      html += '</div>';
      return html;
    },

    navigate(dir) {
      if (this.viewMode === 'day') this.currentDate.setDate(this.currentDate.getDate() + dir);
      else if (this.viewMode === 'week') this.currentDate.setDate(this.currentDate.getDate() + dir * 7);
      else this.currentDate.setMonth(this.currentDate.getMonth() + dir);
      this.render();
    },
    openForm(id = null, dateStr = null, hour = null) {
      const lesson = id ? store.getById('lessons', id) : null;
      const students = store.getAll('students');
      const packages = store.getAll('packages');
      const defaultDate = lesson ? new Date(lesson.startAt) : (dateStr ? new Date(dateStr) : new Date());
      if (hour !== null && !lesson) { defaultDate.setHours(hour, 0, 0, 0); }
      const endDefault = new Date(defaultDate); endDefault.setHours(endDefault.getHours() + 1);
      const activePackages = packages.filter(p => p.status === 'active');

      Modal.open(`
        <div class="modal-title">${lesson ? t('editLesson') : t('newLesson')}</div>
        <form onsubmit="event.preventDefault();CalendarView.save('${id || ''}')">
          <div class="field">
            <label>${t('student')}</label>
            <select name="studentId">
              <option value="">${t('select')}</option>
              ${students.map(s => `<option value="${s.id}" ${lesson && lesson.studentId === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>${t('title')}</label>
            <input name="title" value="${lesson ? lesson.title || '' : ''}" placeholder="${t('lessonTopic')}">
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="field">
              <label>${t('date')}</label>
              <input name="date" type="date" required value="${defaultDate.toISOString().split('T')[0]}">
            </div>

    save(id) {
      const form = document.querySelector('.modal-content form');
      const data = Object.fromEntries(new FormData(form));
      const [hours, mins] = data.time.split(':').map(Number);
      const startAt = new Date(data.date); startAt.setHours(hours, mins, 0, 0);
      const endAt = new Date(startAt); endAt.setMinutes(endAt.getMinutes() + Number(data.duration || 60));
      const lessonData = { studentId: data.studentId || null, title: data.title, startAt: startAt.toISOString(), endAt: endAt.toISOString(), status: data.status, description: data.description, homework: data.homework, packageId: data.packageId || null, price: 0 };
      // Get price from student
      if (data.studentId) { const st = store.getById('students', data.studentId); if (st) lessonData.price = st.pricePerLesson || 0; }

      if (id) {
        store.update('lessons', id, lessonData);
        // If status changed to completed and linked to package, deduct
        const oldLesson = store.getById('lessons', id);
        if (data.status === 'completed' && lessonData.packageId) {
          const pkg = store.getById('packages', lessonData.packageId);
          if (pkg && pkg.usedLessons < pkg.totalLessons) {
            store.update('packages', pkg.id, { usedLessons: pkg.usedLessons + 1, status: pkg.usedLessons + 1 >= pkg.totalLessons ? 'exhausted' : 'active' });
          }
        }
        Toast.success(t('lessonUpdated'));
      } else {
        const count = data.recurring === 'on' ? 1 + Number(data.repeatCount || 0) : 1;
        const createdLessons = [];
        for (let i = 0; i < count; i++) {
          const s = new Date(startAt); s.setDate(s.getDate() + i * 7);
          const e = new Date(endAt); e.setDate(e.getDate() + i * 7);
          const l = store.create('lessons', { ...lessonData, startAt: s.toISOString(), endAt: e.toISOString(), isRecurring: i > 0 });
          createdLessons.push(l);
        }
        // If completed + package, deduct
        createdLessons.forEach(l => {
          if (data.status === 'completed' && l.packageId) {
            const pkg = store.getById('packages', l.packageId);
            if (pkg && pkg.usedLessons < pkg.totalLessons) {
              store.update('packages', pkg.id, { usedLessons: pkg.usedLessons + 1, status: pkg.usedLessons + 1 >= pkg.totalLessons ? 'exhausted' : 'active' });
            }
          }
        });
        Toast.success(count > 1 ? `${count} ${t('lessonsCreated')}` : t('lessonCreated'));
      }
      Modal.close();
      this.render();
    },
    markAsPaid(lessonId) {
      const lesson = store.getById('lessons', lessonId);
      if (!lesson || !lesson.studentId) return;
      const student = store.getById('students', lesson.studentId);
      const amount = student ? Number(student.pricePerLesson) || 0 : 0;
      store.create('payments', {
        studentId: lesson.studentId,
        amount: amount || 0,
        type: 'lesson',
        status: 'paid',
        method: 'cash',
        paidAt: new Date().toISOString(),
        note: `Payment for ${lesson.title || 'lesson'} on ${formatDate(lesson.startAt)}`
      });
      Toast.success(t('paymentRecorded'));
      Modal.close();
      this.render();
    },
    deleteLesson(id) {
      const lesson = store.getById('lessons', id);
      if (!lesson) return;
      // Find recurring weekly lessons: same student, same time, same weekday
      const lessonDate = new Date(lesson.startAt);
      const lessonHour = lessonDate.getHours();
      const lessonMin = lessonDate.getMinutes();
      const lessonDay = lessonDate.getDay();
      const weeklyLessons = store.getAll('lessons').filter(l => {
        if (l.id === lesson.id) return false;
        const d = new Date(l.startAt);
        return l.studentId === lesson.studentId && d.getHours() === lessonHour && d.getMinutes() === lessonMin && d.getDay() === lessonDay;
      });
      if (weeklyLessons.length === 0) {
        ConfirmModal.show(t('deleteLessonConfirm')).then(ok => {
          if (ok) { store.delete('lessons', id); Toast.success(t('lessonDeleted')); Modal.close(); this.render(); }
        });
