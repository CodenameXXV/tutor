/* ---------- move lesson ---------- */
function moveLessonTo(l,nd){
  if(!l||!nd)return 'invalid';
  if(l.date===nd)return 'same';

  const execMove=(mode)=>{
    if(mode==='one'){
      if(l.seriesId){
        const se=series.find(x=>x.id===l.seriesId);
        if(se)(se.skips||(se.skips=[])).push(l.date);
        delete l.seriesId;
      }
      l.date=nd;
    }else if(mode==='all'){
      const diffDays=Math.round((new Date(nd+'T00:00:00').getTime()-new Date(l.date+'T00:00:00').getTime())/(1000*3600*24));
      const se=series.find(x=>x.id===l.seriesId);
      if(se){
        const nStart=new Date(se.start+'T00:00:00'); nStart.setDate(nStart.getDate()+diffDays); se.start=iso(nStart);
        if(se.skips)se.skips=se.skips.map(d=>{const ds=new Date(d+'T00:00:00');ds.setDate(ds.getDate()+diffDays);return iso(ds);});
        if(se.until){const du=new Date(se.until+'T00:00:00');du.setDate(du.getDate()+diffDays);se.until=iso(du);}
      }
      lessons.forEach(x=>{
        if(x.seriesId===l.seriesId){
          const dx=new Date(x.date+'T00:00:00'); dx.setDate(dx.getDate()+diffDays); x.date=iso(dx);
        }
      });
    }
    save();materializeSeries();render();
    cursor=new Date(nd+'T00:00:00');
    selectDay(nd);
    toast('Урок перенесено на '+fmtDate(nd));
  };

  if(l.seriesId){
    openSheet(`${shHead('Перенести урок?',`${fmtDate(l.date)} → ${fmtDate(nd)}`)}
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:4px">
        <button class="btn btn-soft" id="ml-one">Лише поточний урок</button>
        <button class="btn btn-ac" id="ml-all">Кожен такий урок (всю серію)</button>
        <button class="btn btn-soft" data-close>Скасувати</button>
      </div>`);
    $('#ml-one').onclick=()=>{closeSheet();execMove('one');};
    $('#ml-all').onclick=()=>{closeSheet();execMove('all');};
    return 'prompted';
  }else{
    execMove('one');
    return 'moved';
  }
}
function moveLesson(lid){
  const l=lessons.find(x=>x.id===lid);
  if(!l)return;
  const s=getS(l.studentId);
  openSheet(`${shHead('Перенести урок',`${fmtDate(l.date)}, ${l.time}${s?` — ${esc(s.name)}`:''}${l.seriesId?' · щотижневий урок':''}`)}
    <label class="field"><span>Новий день</span>
      <input class="inp" id="lm-date" type="date" value="${l.date}"></label>
    <button class="btn btn-block" id="lm-save">Перенести</button>`);
  $('#lm-save').onclick=()=>{
    const nd=$('#lm-date').value;
    if(!nd){$('#lm-date').classList.add('err');return toast('Оберіть дату',1);}
    if(nd===l.date)return closeSheet();            // дата не змінилась
    if(moveLessonTo(l,nd)==='moved') closeSheet();
  };
  $('#lm-date').oninput=e=>e.target.classList.remove('err');
}

function removeLesson(lid,afterDone){
  const l=lessons.find(x=>x.id===lid);
  if(!l)return;
  const sid=l.studentId,open=$('#ov').classList.contains('on');
  const done=()=>{save();render();if(afterDone)return afterDone();if(open)studentSheet(sid);};
  if(l.seriesId){
    // recurring occurrence — offer: this one only, or stop the whole series
    openSheet(`${shHead('Видалити урок?',`${fmtDate(l.date)}, ${l.time} — щотижневий урок.`)}
      <div style="display:flex;flex-direction:column;gap:9px;margin-top:4px">
        <button class="btn btn-soft" id="rl-one">Лише цей урок</button>
        <button class="btn btn-da" id="rl-all">Припинити повторення</button>
        <button class="btn btn-soft" data-close>Скасувати</button>
      </div>`);
    $('#rl-one').onclick=()=>{
      const se=series.find(x=>x.id===l.seriesId);
      if(se)(se.skips||(se.skips=[])).push(l.date);   // don't regenerate this date
      lessons=lessons.filter(x=>x.id!==lid);
      closeSheet();done();toast('Урок видалено');
    };
    $('#rl-all').onclick=()=>{
      // stop future generation from this date on; keep past/paid occurrences intact
      const sid=l.seriesId;
      lessons=lessons.filter(x=>!(x.seriesId===sid&&x.date>=l.date&&!x.paid));
      // detach remaining (paid) lessons so they become standalone
      lessons.forEach(x=>{ if(x.seriesId===sid) delete x.seriesId; });
      // fully remove the dead series rule
      series=series.filter(x=>x.id!==sid);
      closeSheet();done();toast('Повторення припинено');
    };
    return;
  }
  confirmSheet('Видалити урок?',`${fmtDate(l.date)}, ${l.time} — ${l.topic||'урок'}.`,'Видалити',()=>{
    lessons=lessons.filter(x=>x.id!==lid);
    done();toast('Урок видалено');
  });
}

      };
      $('#et-all').onclick=()=>{
        l.time=nt;
        const se=series.find(x=>x.id===l.seriesId);
        if(se)se.time=nt;                          // оновлюємо правило повторення для майбутніх тижнів
        lessons.forEach(x=>{if(x.seriesId===l.seriesId)x.time=nt;});
        save();closeSheet();render();toast(`Час змінено (всі уроки на ${day})`);
      };
      return;
    }
    l.time=nt;save();closeSheet();render();toast('Час уроку змінено');
  };
  $('#lt-time').oninput=e=>e.target.classList.remove('err');
}

/* ---------- context menu ---------- */
const ctxEl=$('#ctx');
let ctxOpen=false;

function closeCtx(){
  if(!ctxOpen)return;
  ctxOpen=false;
  ctxEl.classList.remove('on');
  ctxEl.setAttribute('aria-hidden','true');
  setTimeout(()=>{if(!ctxOpen)ctxEl.innerHTML='';},170);
}

function openCtx(x,y,head,items,anchor){
  const rows=items.map(it=>it.sep
    ? '<div class="ctx-sep"></div>'
    : `<button class="ctx-item${it.danger?' danger':''}" role="menuitem"><span class="ci">${it.ico||''}</span><span>${esc(it.label)}</span></button>`
  ).join('');
  ctxEl.innerHTML=(head?`<div class="ctx-head">${head}</div>`:'')+rows;

  const btns=ctxEl.querySelectorAll('.ctx-item');
  let bi=0;
  items.forEach(it=>{if(it.sep)return;btns[bi++].onclick=()=>{closeCtx();it.fn();};});

  ctxEl.classList.add('on');
  ctxEl.setAttribute('aria-hidden','false');
  ctxOpen=true;
  const pad=8,w=ctxEl.offsetWidth,h=ctxEl.offsetHeight;
  if(anchor){
    const r=anchor.getBoundingClientRect();
    ctxEl.style.left=Math.max(pad,Math.min(r.right-w,innerWidth-w-pad))+'px';
    ctxEl.style.top=Math.max(pad,Math.min(r.bottom+6,innerHeight-h-pad))+'px';
  }else{
    ctxEl.style.left=Math.max(pad,Math.min(x,innerWidth-w-pad))+'px';
    ctxEl.style.top=Math.max(pad,Math.min(y,innerHeight-h-pad))+'px';
  }
}

const ctxHeadStudent=s=>`${avatar(s,'av-sm')}<span class="nm">${esc(s.name)}</span>`;

function menuStudent(id){
  const s=getS(id);
  if(!s)return null;
  const owes=unpaidOf(id).length>0;
  return {head:ctxHeadStudent(s),items:[
    {label:'Відкрити картку',ico:'▤',fn:()=>studentSheet(id)},
    {label:'Додати урок',ico:'＋',fn:()=>lessonForm(picked,id)},
    ...(owes?[{label:'Прийняв оплату',ico:'₴',fn:()=>acceptPayment(id)}]:[]),
    {sep:1},
    {label:'Редагувати',ico:'✎',fn:()=>studentForm(id)},
    {label:'Видалити учня',ico:'✕',danger:1,fn:()=>deleteStudent(id)}
  ]};
}

function menuLesson(id){
  const l=lessons.find(x=>x.id===id);
  if(!l)return null;
  const s=getS(l.studentId);
  const rec=l.seriesId?' ↻':'';
  return {head:`<span class="nm">${esc(l.time)} · ${esc(l.topic||s?.name||'Урок')}${rec}</span>`,items:[
    {label:l.paid?'Скасувати оплату':'Позначити оплаченим',ico:l.paid?'↺':'✓',fn:()=>toggleLesson(id)},
    {label:'Змінити час',ico:'◷',fn:()=>editLessonTime(id)},
    ...(s?[{label:'Відкрити учня',ico:'▤',fn:()=>studentSheet(s.id)}]:[]),
    {sep:1},
    {label:l.seriesId?'Видалити урок…':'Видалити урок',ico:'✕',danger:1,fn:()=>removeLesson(id)}
  ]};
}

function goToday(){cursor=new Date();selectDay(TODAY);}

function menuDay(date){
  const items=[{label:'Додати урок',ico:'＋',fn:()=>{selectDay(date);lessonForm(date);}}];
  if(date!==picked)items.unshift({label:'Обрати день',ico:'▸',fn:()=>selectDay(date)});
  if(onDay(date).length)items.push({label:'Уроки цього дня',ico:'▤',fn:()=>{selectDay(date);$('#day-list').scrollIntoView({behavior:'smooth',block:'nearest'});}});
  if(date!==TODAY){items.push({sep:1});items.push({label:'Перейти до сьогодні',ico:'◈',fn:goToday});}
  return {head:`<span class="nm">${fmtDate(date)} · ${wdOf(date)}</span>`,items};
}

addEventListener('contextmenu',e=>{
  if($('#ov').classList.contains('on'))return;
  const lsn=e.target.closest('.lsn[data-lesson]');
  const wlsn=e.target.closest('.wk-lsn[data-lesson]');
  const prow=e.target.closest('.pay-row[data-student]');
  const scard=e.target.closest('.s-card[data-student]');
  const day=e.target.closest('.day[data-date]:not(.pad)');
  const wcol=e.target.closest('.wk-col[data-week-day]');
  let cfg=null;
  if(lsn)cfg=menuLesson(+lsn.dataset.lesson);
  else if(wlsn)cfg=menuLesson(+wlsn.dataset.lesson);
  else if(prow)cfg=menuStudent(+prow.dataset.student);
  else if(scard)cfg=menuStudent(+scard.dataset.student);
  else if(day)cfg=menuDay(day.dataset.date);
  else if(wcol)cfg=menuDay(wcol.dataset.weekDay);
  else if(e.target.closest('#v-students'))cfg={head:'<span class="nm">Учні</span>',items:[
    {label:'Додати учня',ico:'＋',fn:()=>studentForm()},
    {label:'Додати урок',ico:'◷',fn:()=>lessonForm(picked)},
    {sep:1},
    {label:'Вільні години',ico:'▦',fn:freeHoursSheet}
  ]};
  else if(e.target.closest('#v-schedule'))cfg={head:'<span class="nm">Розклад</span>',items:[
    {label:'Додати урок на обраний день',ico:'＋',fn:()=>lessonForm(picked)},
    {label:'Перейти до сьогодні',ico:'◈',fn:goToday},
    {sep:1},
    {label:'Вільні години',ico:'▦',fn:freeHoursSheet}
  ]};
  if(!cfg)return;
  e.preventDefault();
  openCtx(e.clientX,e.clientY,cfg.head,cfg.items);
});

/* ---------- events ---------- */
function shiftMonth(d){
  cursor=new Date(cursor.getFullYear(),cursor.getMonth()+d,1);
  materializeSeries();
  renderCalendar();
}
$('#prev').onclick=()=>shiftMonth(-1);
$('#next').onclick=()=>shiftMonth(1);
$('#wk-prev').onclick=()=>shiftWeek(-1);
$('#wk-next').onclick=()=>shiftWeek(1);
$('#add-here').onclick=()=>lessonForm(picked);

/* ---------- drag & drop: перенесення уроку на інший день ---------- */
let dragId=null;
document.addEventListener('dragstart',e=>{
  const el=e.target.closest('[data-lesson][draggable]');
  if(!el){e.preventDefault();return;}
  dragId=Number(el.dataset.lesson);
  try{e.dataTransfer.setData('text/plain',String(dragId));}catch{}
  e.dataTransfer.effectAllowed='move';
  el.classList.add('drag');
});
document.addEventListener('dragend',()=>{
  dragId=null;
  document.querySelectorAll('.drag,.drop-ok').forEach(el=>el.classList.remove('drag','drop-ok'));
});
document.addEventListener('dragover',e=>{
  const target=e.target.closest('.day[data-date]:not(.pad)')||e.target.closest('.wk-col[data-week-day]');
  if(target&&dragId!=null){e.preventDefault();e.dataTransfer.dropEffect='move';target.classList.add('drop-ok');}
});
document.addEventListener('dragleave',e=>{
  const t=e.target.closest('.drop-ok');
  if(!t)return;
  if(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.drop-ok'))return;
  t.classList.remove('drop-ok');
});
document.addEventListener('drop',e=>{
  const day=e.target.closest('.day[data-date]:not(.pad)');
  const wcol=e.target.closest('.wk-col[data-week-day]');
  const nd=day?day.dataset.date:(wcol?wcol.dataset.weekDay:null);
  document.querySelectorAll('.drop-ok').forEach(el=>el.classList.remove('drop-ok'));
  if(dragId==null)return;
  e.preventDefault();
  const id=dragId;dragId=null;
  const l=lessons.find(x=>x.id===id);
  if(!l)return;
  if(moveLessonTo(l,nd)==='same')toast('Урок уже на цій даті',1);
});

/* ---------- account menu ---------- */
function accountMenu(av){
  const loggedIn=av.dataset.auth==='out';
  const isDark=document.documentElement.dataset.theme==='dark';
  const head=loggedIn&&av.title?`<span class="nm">${esc(av.title)}</span>`:null;
  openCtx(0,0,head,[
    {ico:loggedIn?'🚪':'👤',label:loggedIn?'Вийти':'Увійти',fn:()=>{
      if(loggedIn)confirmSheet('Вийти з акаунту?','Ваші дані збережені у хмарі.','Вийти',()=>window._fbAuth?.logout());
      else window._fbAuth?.login();
    }},
    {ico:isDark?'☀':'◐',label:isDark?'Світла тема':'Темна тема',fn:toggleTheme},
    {sep:1},
    {ico:'⟲',label:'Скинути всі налаштування',danger:1,fn:resetAllSettings}
  ],av);
}

function resetAllSettings(){
  const loggedIn=document.getElementById('auth-av').dataset.auth==='out';
  confirmSheet('Скинути всі налаштування?',
    loggedIn
      ?'Буде видалено всі дані та налаштування — з цього пристрою та з вашого акаунта. Дію неможливо скасувати.'
      :'Буде видалено всі дані та налаштування на цьому пристрої. Дію неможливо скасувати.',
    'Скинути',()=>{
      students=[];lessons=[];series=[];
      try{localStorage.clear();}catch{}
      applyTheme('light');
      try{localStorage.setItem('tb_theme',document.documentElement.dataset.theme);}catch{}
      calView='month';
      applyCalView('month');
      save();
      render();
      toast('Все скинуто');
    });
}

document.addEventListener('click',e=>{
  const t=e.target;
  const hit=sel=>t.closest(sel);

  const authAv=hit('#auth-av');
  if(authAv){
    accountMenu(authAv);
    return;
  }

  const tabBtn=hit('.tab');
  if(tabBtn)return switchTab(tabBtn.dataset.tab);

  const seg=hit('.cal-seg');
  if(seg){applyCalView(seg.id==='view-week'?'week':'month');return goToday();}

  const go=hit('[data-goto]');
  if(go)return switchTab(go.dataset.goto);

  const fh=hit('[data-free-hours]');
  if(fh)return freeHoursSheet();

  const et=hit('[data-edit-time]');
  if(et){e.stopPropagation();return editLessonTime(Number(et.dataset.editTime));}

  const wlsn=hit('.wk-lsn[data-lesson]');
  if(wlsn){e.stopPropagation();return lessonDetails(Number(wlsn.dataset.lesson));}

  const day=hit('.day[data-date]');
  if(day){
    selectDay(day.dataset.date);
    return;
  }

  const wcol=hit('[data-week-day]');
  if(wcol){
    selectDay(wcol.dataset.weekDay);
    return;
  }

  const open=hit('[data-open]');
  if(open)return open.dataset.open==='student'?studentForm():lessonForm();

  // inner action buttons must win over their containers
  const tg=hit('[data-toggle]');
  if(tg){e.stopPropagation();return toggleLesson(Number(tg.dataset.toggle));}

  const dl=hit('[data-del]');
  if(dl){e.stopPropagation();return removeLesson(Number(dl.dataset.del));}

  const pay=hit('[data-pay]');
  if(pay){e.stopPropagation();return acceptPayment(Number(pay.dataset.pay));}

  const av=hit('[data-student-av]');
  if(av){e.stopPropagation();return studentSheet(Number(av.dataset.studentAv));}

  const sc=hit('[data-student]');
  if(sc)return studentSheet(Number(sc.dataset.student));

  const lsn=hit('.lsn[data-lesson]');
  if(lsn)return lessonDetails(Number(lsn.dataset.lesson));

  if(hit('[data-close]'))return closeSheet();
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ctxOpen)return closeCtx();
  if(e.key==='Escape'&&$('#ov').classList.contains('on'))return closeSheet();
  if($('#ov').classList.contains('on')||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  if(tab==='schedule'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){
    const step=e.key==='ArrowRight'?1:-1;
    const d=new Date(picked+'T00:00:00');
    d.setDate(d.getDate()+step);
    if(d.getMonth()!==cursor.getMonth()||d.getFullYear()!==cursor.getFullYear())cursor=new Date(d);
    selectDay(iso(d));
    e.preventDefault();
  }
  if(e.key==='1')switchTab('students');
  if(e.key==='2')switchTab('schedule');
  if(e.key==='3')switchTab('payments');
  if(e.key==='n'||e.key==='т')lessonForm(picked);
});

addEventListener('resize',movePill);

// dismiss context menu
document.addEventListener('pointerdown',e=>{if(ctxOpen&&!e.target.closest('#ctx'))closeCtx();},true);
addEventListener('scroll',closeCtx,true);
addEventListener('resize',closeCtx);
addEventListener('blur',closeCtx);

/* ---------- boot ---------- */
applyCalView(calView);
render();
requestAnimationFrame(movePill);
document.fonts?.ready.then(movePill);
</script>
