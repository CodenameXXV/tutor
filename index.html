      const form = document.querySelector('.modal-content form');
      const data = Object.fromEntries(new FormData(form));
      store.create('payments', { studentId: data.studentId, amount: Number(data.amount), type: data.type, status: data.status, method: data.method, note: data.note, paidAt: new Date().toISOString() });
      Toast.success(t('paymentRecorded'));
      Modal.close();
      this.render();
    },
    deletePayment(id) {
      ConfirmModal.show(t('deletePaymentConfirm')).then(ok => {
        if (ok) { store.delete('payments', id); Toast.success(t('paymentDeleted')); this.render(); }
      });
    },
    exportCSV() {
      const payments = store.getAll('payments');
      const students = store.getAll('students');
      const settings = getSettings();
      const data = payments.map(p => { const st = students.find(s => s.id === p.studentId); return { Student: st ? st.name : 'Unknown', Amount: p.amount, Currency: settings.currency, Type: p.type, Status: p.status, Method: p.method, Date: formatDate(p.paidAt), Note: p.note || '' }; });
      exportCSV(data, 'payments.csv');
    }
  };

  // ==================== MATERIALS VIEW ====================
  const MaterialsView = {
    render() {
      const materials = store.getAll('materials');
      const content = `
        <div class="flex items-center justify-between mb-6">
          <div><h1 class="text-2xl font-bold">${t('materialsTitle')}</h1><p class="text-sm text-slate-500 dark:text-slate-400">${materials.length} ${t('items')}</p></div>
          <button onclick="MaterialsView.openForm()" class="gradient-bg text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 hover:opacity-90">${Icons.plus} ${t('addMaterial')}</button>
        </div>
        ${materials.length === 0 ? `<div class="text-center py-16"><div class="w-16 h-16 mx-auto mb-4 gradient-bg rounded-2xl flex items-center justify-center text-white opacity-50">${Icons.book}</div><h3 class="text-lg font-semibold mb-2">${t('noMaterialsYet')}</h3><p class="text-sm text-slate-400">${t('addMaterialsHint')}</p></div>` : `
          <div class="grid gap-3 md:grid-cols-2 lg:grid-cols-3">${materials.map(m => `
            <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-100 dark:border-slate-700 shadow-sm">
              <div class="flex items-start justify-between">
                <div class="flex items-center gap-2 mb-2">
                  <span class="w-8 h-8 rounded-lg gradient-bg flex items-center justify-center text-white text-xs">${m.type === 'link' ? Icons.link : m.type === 'file' ? Icons.file : Icons.book}</span>
                  <span class="text-xs font-semibold uppercase text-slate-400">${m.type}</span>
                </div>
                <button onclick="MaterialsView.deleteMaterial('${m.id}')" class="p-1 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20 text-red-400">${Icons.trash}</button>
              </div>
              <h3 class="font-semibold text-sm mb-1">${m.title}</h3>
              ${m.content ? `<p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-3">${m.content}</p>` : ''}
              ${m.url ? `<a href="${m.url}" target="_blank" class="text-xs text-primary-500 hover:underline break-all">${m.url}</a>` : ''}
              ${m.tags && m.tags.length ? `<div class="flex gap-1 mt-2 flex-wrap">${m.tags.map(t => `<span class="px-2 py-0.5 bg-slate-100 dark:bg-slate-700 rounded-full text-xs text-slate-500">${t}</span>`).join('')}</div>` : ''}
              <div class="text-xs text-slate-400 mt-2">${formatDate(m.createdAt)}</div>
            </div>
          `).join('')}</div>`}`;
      AppShell.render(content);
    },
    openForm() {
      Modal.open(`
        <h3 class="text-lg font-bold mb-4">${t('addMaterial')}</h3>
        <form onsubmit="event.preventDefault();MaterialsView.save()" class="space-y-3">
          <div><label class="text-xs font-semibold text-slate-500">${t('materialTitle')} *</label><input name="title" required class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm"></div>
          <div><label class="text-xs font-semibold text-slate-500">${t('materialType')}</label><select name="type" id="mat-type" onchange="MaterialsView.toggleFields()" class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm"><option value="note">${t('materialNote')}</option><option value="link">${t('materialLink')}</option><option value="file">${t('materialFile')}</option></select></div>
          <div id="url-field" class="hidden"><label class="text-xs font-semibold text-slate-500">${t('url')}</label><input name="url" class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm"></div>
          <div id="content-field"><label class="text-xs font-semibold text-slate-500">${t('content')}</label><textarea name="content" rows="4" class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm"></textarea></div>
          <div><label class="text-xs font-semibold text-slate-500">${t('tagsLabel')}</label><input name="tags" class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm" placeholder="grammar, homework"></div>
          <button type="submit" class="w-full gradient-bg text-white py-2.5 rounded-xl font-semibold text-sm hover:opacity-90">${t('saveMaterial')}</button>
        </form>
      `);
    },
    toggleFields() {
      const type = document.getElementById('mat-type').value;
      document.getElementById('url-field').classList.toggle('hidden', type !== 'link');
      document.getElementById('content-field').classList.toggle('hidden', type === 'file');
    },
    save() {
      const form = document.querySelector('.modal-content form');
      const data = Object.fromEntries(new FormData(form));
      const tags = data.tags ? data.tags.split(',').map(t => t.trim()).filter(Boolean) : [];
      store.create('materials', { title: data.title, type: data.type, url: data.url || null, content: data.content || null, tags });
      Toast.success(t('materialAdded'));
      Modal.close();
      this.render();
    },
    deleteMaterial(id) {
      ConfirmModal.show(t('deleteMaterialConfirm')).then(ok => {
        if (ok) { store.delete('materials', id); Toast.success(t('materialDeleted')); this.render(); }
      });
    }
  };

  // ==================== SETTINGS VIEW ====================
  const SettingsView = {
    render() {
      const s = getSettings();
      const content = `
        <h1 class="text-2xl font-bold mb-6">${t('settingsTitle')}</h1>
        <div class="max-w-lg space-y-6">
          <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-100 dark:border-slate-700">
            <h3 class="font-semibold mb-4">${t('profile')}</h3>
            <form onsubmit="event.preventDefault();SettingsView.saveProfile()" class="space-y-3">
              <div><label class="text-xs font-semibold text-slate-500">${t('yourName')}</label><input name="name" value="${s.name || firebase.auth().currentUser?.displayName || ''}" class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm"></div>
              <div><label class="text-xs font-semibold text-slate-500">${t('currency')}</label><select name="currency" class="w-full mt-1 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm"><option value="UAH" ${s.currency === 'UAH' ? 'selected' : ''}>UAH (₴)</option><option value="USD" ${s.currency === 'USD' ? 'selected' : ''}>USD ($)</option><option value="EUR" ${s.currency === 'EUR' ? 'selected' : ''}>EUR (€)</option><option value="GBP" ${s.currency === 'GBP' ? 'selected' : ''}>GBP (£)</option></select></div>
              <button type="submit" class="gradient-bg text-white px-6 py-2 rounded-xl text-sm font-semibold hover:opacity-90">${t('save')}</button>
            </form>
          </div>
          <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-100 dark:border-slate-700">
            <h3 class="font-semibold mb-4">${t('appearance')}</h3>
            <div class="flex items-center justify-between">
              <span class="text-sm">${t('darkMode')}</span>
              <button onclick="toggleTheme()" class="w-12 h-7 rounded-full transition-colors ${s.theme === 'dark' ? 'gradient-bg' : 'bg-slate-200'} relative">
                <span class="absolute top-0.5 ${s.theme === 'dark' ? 'left-6' : 'left-0.5'} w-6 h-6 bg-white rounded-full shadow transition-all"></span>
              </button>
            </div>
          </div>
          <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-100 dark:border-slate-700">
            <h3 class="font-semibold mb-4">${t('language')}</h3>
            <div class="flex items-center justify-between">
              <span class="text-sm">${t('language')}</span>
              <select onchange="setLang(this.value)" class="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm">
                <option value="en" ${getLang()==='en'?'selected':''}>${t('english')}</option>
                <option value="uk" ${getLang()==='uk'?'selected':''}>${t('ukrainian')}</option>
              </select>
            </div>
          </div>
          <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-100 dark:border-slate-700">
            <h3 class="font-semibold mb-4">${t('dataManagement')}</h3>
            <div class="flex gap-3">
              <button onclick="SettingsView.exportData()" class="flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-600 text-sm hover:bg-slate-50 dark:hover:bg-slate-700">${Icons.download} ${t('exportBackup')}</button>
              <label class="flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-600 text-sm hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer">${Icons.upload} ${t('importBackup')}<input type="file" accept=".json" class="hidden" onchange="SettingsView.importData(event)"></label>
            </div>
            <button onclick="SettingsView.clearData()" class="mt-3 px-4 py-2 rounded-xl border border-red-200 text-red-500 text-sm hover:bg-red-50 dark:hover:bg-red-900/20">${t('clearAllData')}</button>
          </div>
        </div>`;
      AppShell.render(content);
    },
    saveProfile() {
      const form = document.querySelector('.modal-content form') || document.querySelector('#page-content form');
      const data = Object.fromEntries(new FormData(form));
      const current = getSettings();
      store.saveSettings({ ...current, name: data.name, currency: data.currency });
      Toast.success(t('settingsSaved'));
      this.render();
    },
    exportData() {
      const data = store.exportAll();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `tutorpro-backup-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      Toast.success(t('backupExported'));
    },
    importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          store.importAll(data).then(() => {
            Toast.success(t('dataImported'));
            Router.navigate('dashboard');
          });
        } catch (err) { Toast.error(t('invalidBackup')); }
      };
      reader.readAsText(file);
    },
    clearData() {
      ConfirmModal.show(t('clearConfirm1')).then(ok1 => {
        if (!ok1) return;
        ConfirmModal.show(t('clearConfirm2')).then(ok2 => {
          if (!ok2) return;
          const batch = db.batch();
          const promises = COLLECTIONS.map(col =>
            db.collection('users').doc(store._uid).collection(col).get().then(snap => {
              snap.docs.forEach(doc => batch.delete(doc.ref));
            })
          );
          Promise.all(promises).then(() => {
            batch.commit();
            db.doc('users/' + store._uid + '/settings/app').set({});
          }).then(() => {
            COLLECTIONS.forEach(c => store._cache[c] = []);
            store._cache.settings = {};
            Toast.success(t('allDataCleared'));
            Router.navigate('dashboard');
          });
        });
      });
    }
  };

  // ==================== ROUTER SETUP ====================
  Router.register('dashboard', () => DashboardView.render());
  Router.register('students', () => StudentsView.render());
  Router.register('student', (params) => StudentProfileView.render(params.id));
  Router.register('calendar', () => CalendarView.render());
  Router.register('payments', () => PaymentsView.render());
  Router.register('materials', () => MaterialsView.render());
  Router.register('settings', () => SettingsView.render());

  // ==================== KEYBOARD SHORTCUTS ====================
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey) {
      if (e.key === 'k' || e.key === 'K') { e.preventDefault(); document.getElementById('global-search')?.focus(); }
      if (e.key === 'n' || e.key === 'N') { e.preventDefault(); if (Router.current === 'calendar') CalendarView.openForm(); else if (Router.current === 'students') StudentsView.openForm(); }
    }
    if (e.key === 'Escape') Modal.close();
  });

  // Close search results on click outside
  document.addEventListener('click', (e) => {
    const sr = document.getElementById('search-results');
    if (sr && !e.target.closest('#global-search') && !e.target.closest('#search-results')) sr.classList.add('hidden');
  });

  // ==================== START APP (auth-gated) ====================
  document.documentElement.lang = getLang();

  firebase.auth().onAuthStateChanged(user => {
    if (user) {
      // User is signed in — load data + start app
      store.init(user.uid).then(() => {
        Router.start();
        if (store.getSettings().lang) document.documentElement.lang = store.getSettings().lang;
      }).catch(err => {
        console.error('Firestore init failed:', err);
        Router.start();
      });
    } else {
      // No user — show login screen (Router.start will be called after sign-in)
      LoginView.render();
    }
  });
  </script>
</body>
</html>
